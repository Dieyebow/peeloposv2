<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Peelo POS</title>
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Système de point de vente moderne">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="https://pos.peelo.shop/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="https://pos.peelo.shop/favicon-peelo.svg">
    <link rel="apple-touch-icon" href="https://pos.peelo.shop/favicon.ico">

    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Peelo POS">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Roboto"', 'sans-serif'],
            },
            colors: {
              primary: '#00c58e', // Green transition base
              secondary: '#128C7E',
              accent: '#f97316', 
              dark: '#1e293b',
              light: '#f8fafc'
            },
            borderRadius: {
              'xl': '0.5rem',
              '2xl': '0.75rem',
              '3xl': '1rem',
            }
          }
        }
      }
    </script>
    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }
      /* Viewport fallbacks for older devices */
      .h-viewport {
          height: 100vh;
          height: 100dvh;
      }
      .min-h-viewport {
          min-height: 100vh;
          min-height: 100dvh;
      }

      /* Barres de défilement forcées visibles (tablettes & desktop) */
      .custom-scrollbar::-webkit-scrollbar {
          width: 8px;
          height: 8px;
          display: block; /* Force l'affichage même sur iOS */
      }
      .custom-scrollbar::-webkit-scrollbar-track {
          background: rgba(0,0,0,0.02);
          border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
          background-color: #cbd5e1;
          border-radius: 10px;
          border: 2px solid #ffffff;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
          background-color: #94a3b8;
      }
      .custom-scrollbar {
          scrollbar-width: thin;
          scrollbar-color: #cbd5e1 rgba(0,0,0,0.02);
          -webkit-overflow-scrolling: touch;
      }
    </style>

}
